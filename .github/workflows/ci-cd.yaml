name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  # ================================================================
  # JOB 1: Python linting
  #
  # First quality gate.
  # The rest of the pipeline runs only if Python linting passes.
  # ================================================================
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pylint pytest

      - name: Run Pylint
        run: |
          pylint --errors-only $(git ls-files '*.py')


  # ================================================================
  # JOB 1: Python tests and code coverage
  # ================================================================
  test-and-coverage:
    name: Tests & Coverage
    needs:
      - python-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep local development, CI tests, and container builds
      # on the same Python version.
      - name: Read Python version
        id: python
        run: |
          echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests and measure coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}


  # ================================================================
  # JOB 2: Source / filesystem security scan
  #
  # Runs in parallel with tests because neither depends on the other.
  # ================================================================
  security-scan:
    name: Source Security Scan
    needs:
      - python-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true


  # ================================================================
  # JOB 3: Build -> Scan -> Publish
  #
  # The Docker image is built ONCE.
  #
  # Flow:
  #   tests + source security
  #       -> build local image
  #       -> scan exact image with Trivy
  #       -> publish exact same image if scan passes
  #
  # Pull Requests:
  #   build + scan only
  #
  # main / version tags:
  #   build + scan + publish
  # ================================================================
  image-pipeline:
    name: Build → Scan → Publish

    needs:
      - test-and-coverage
      - security-scan

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Read Python version
        id: python
        run: |
          echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"


      # Generate final GHCR tags and OCI labels before the image is built.
      # The labels therefore become part of the exact image that Trivy scans.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag

          labels: |
            org.opencontainers.image.title=k8s-network-monitor
            org.opencontainers.image.description=Cloud-native network monitoring solution deployed on Kubernetes with Prometheus metrics and Grafana dashboards
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT


      # Build ONCE and load into the runner's local Docker daemon.
      #
      # We use one predictable local tag for:
      #   - runtime verification
      #   - Trivy scan
      #   - subsequent GHCR tagging/publishing
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: k8s-network-monitor:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ steps.python.outputs.version }}


      - name: Verify container runtime
        run: |
          docker run --rm \
            k8s-network-monitor:${{ github.sha }} \
            python --version


      # Security gate.
      # If HIGH/CRITICAL CVEs are found, exit-code 1 stops this job,
      # therefore the following publish steps never execute.
      - name: Run Trivy container image CVE scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: k8s-network-monitor:${{ github.sha }}
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln
          exit-code: "1"
          ignore-unfixed: true

          # pip contains a third-party CycloneDX SBOM that reported
          # stale package versions not present in the runtime image.
          skip-dirs: /usr/local/lib/python3.13/site-packages/pip/_vendor


      # Everything below here runs ONLY if Trivy passed
      # and this workflow was triggered by a push.
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # Apply the tags generated by docker/metadata-action to the
      # SAME LOCAL IMAGE that was just scanned.
      - name: Tag validated image
        if: github.event_name == 'push'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue

            echo "Tagging:"
            echo "  k8s-network-monitor:${GITHUB_SHA}"
            echo "  -> $tag"

            docker tag \
              "k8s-network-monitor:${GITHUB_SHA}" \
              "$tag"
          done <<< "$IMAGE_TAGS"


  # ================================================================
  # FINAL JOB: Pipeline summary
  #
  # Runs after all pipeline gates have completed.
  # ================================================================
  pipeline-summary:
    name: Pipeline Summary
    needs:
      - python-lint
      - test-and-coverage
      - security-scan
      - image-pipeline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate pipeline summary
        run: |
          echo "## 🚦 CI/CD Pipeline Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐍 Python Lint | ${{ needs.python-lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🧪 Tests & Coverage | ${{ needs.test-and-coverage.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Source Security | ${{ needs.security-scan.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐳 Build → CVE Scan → Publish | ${{ needs.image-pipeline.result }} |" >> "$GITHUB_STEP_SUMMARY"
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  # ================================================================
  # JOB 1: Python tests and code coverage
  # ================================================================
  test-and-coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Keep local development, CI tests, and container builds
      # on the same Python version.
      - name: Read Python version
        id: python
        run: |
          echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests and measure coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}


  # ================================================================
  # JOB 2: Source / filesystem security scan
  #
  # Runs in parallel with tests because neither depends on the other.
  # ================================================================
  security-scan:
    name: Source Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH


  # ================================================================
  # JOB 3: Docker build validation
  #
  # Runs only after tests and source security checks pass.
  # ================================================================
  docker-build:
    name: Build Docker Image
    needs:
      - test-and-coverage
      - security-scan

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Python version
        id: python
        run: |
          echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: k8s-network-monitor:test
          build-args: |
            PYTHON_VERSION=${{ steps.python.outputs.version }}


  # ================================================================
  # JOB 4: Container image vulnerability / CVE scan
  #
  # Acts as the security gate between image build and publication.
  # ================================================================
  container-security-scan:
    name: Container Image CVE Scan
    needs:
      - docker-build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Python version
        id: python
        run: |
          echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image for security scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: k8s-network-monitor:${{ github.sha }}
          build-args: |
            PYTHON_VERSION=${{ steps.python.outputs.version }}

      # Useful sanity check showing exactly which Python runtime
      # exists inside the image being scanned.
      - name: Verify container runtime
        run: |
          docker run --rm \
            k8s-network-monitor:${{ github.sha }} \
            python --version

      - name: Run Trivy container image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: k8s-network-monitor:${{ github.sha }}
          scan-type: image
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln
          exit-code: "1"
          ignore-unfixed: true

          # pip contains a third-party CycloneDX SBOM under _vendor
          # that reported stale package versions not present in the
          # actual runtime environment. Skip that metadata directory
          # while continuing to scan installed runtime packages.
          skip-dirs: /usr/local/lib/python3.13/site-packages/pip/_vendor


  # ================================================================
  # JOB 5: Publish production image
  #
  # Pull Requests:
  #   tests + source security
  #           -> build
  #           -> container CVE scan
  #           -> NO publish
  #
  # main / version tag:
  #   tests + source security
  #           -> build
  #           -> container CVE scan
  #           -> publish to GHCR
  # ================================================================
  publish-image:
    name: Publish Image to GHCR
    needs:
      - container-security-scan

    # Never publish images from pull requests.
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Python version
        id: python
        run: |
          echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=k8s-network-monitor
            org.opencontainers.image.description=Cloud-native network monitoring solution deployed on Kubernetes with Prometheus metrics and Grafana dashboards
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.licenses=MIT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ steps.python.outputs.version }}
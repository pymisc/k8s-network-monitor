apiVersion: v1
kind: Service

metadata:
  name: {{ include "k8s-network-monitor.fullname" . }}

  labels:
    {{- include "k8s-network-monitor.labels" . | nindent 4 }}


spec:

  type: {{ .Values.service.type }}

  selector:
    {{- include "k8s-network-monitor.selectorLabels" . | nindent 4 }}

  ports:

    - port: {{ .Values.service.port }}

      targetPort: 8080